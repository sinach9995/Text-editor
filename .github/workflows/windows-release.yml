name: Build Hermes Editor Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'windows/package-lock.json'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'windows/src-tauri -> target'
      - name: Install npm dependencies
        run: npm ci
      - name: Prepare offline web assets
        run: npm run build:web
      - name: Run Windows frontend unit tests
        run: npm test
      - name: Run Rust unit tests
        working-directory: windows/src-tauri
        run: cargo test
      - name: Build Windows installer and executable
        run: npx tauri build --bundles nsis
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Editor-windows-portable-exe
          path: windows/src-tauri/target/release/hermes-text-editor.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Editor-windows-installer-exe
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
