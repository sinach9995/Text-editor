name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo5 libncurses5-dev libncursesw5-dev
        pip install --upgrade "pip<24.1" "setuptools<70.0" "Cython<3.0" buildozer

    - name: Pre-download freetype (savannah.gnu.org blocks GitHub runners)
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/build-arm64-v8a/packages/freetype
        curl -L -o /home/runner/.buildozer/android/platform/build-arm64-v8a/packages/freetype/freetype-2.14.1.tar.gz \
          "https://mirrors.ocf.berkeley.edu/nongnu/freetype/freetype-2.14.1.tar.gz"
        echo "freetype downloaded OK"

    - name: Build with Buildozer
      run: |
        yes | buildozer android debug
      env:
        ALLOW_ROOT: 1
        CFLAGS: "-Wno-error=implicit-function-declaration"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
