name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo5 libncurses5-dev libncursesw5-dev
        pip install --upgrade pip setuptools<70.0 Cython<3.0 buildozer

    - name: Build with Buildozer
      run: |
        yes | buildozer android debug
      env:
        ALLOW_ROOT: 1

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
