[package]
name = "hermes-text-editor"
version = "1.7.1"
description = "Hermes Text Editor for Windows"
authors = ["Sina Chaghamirza · AsoraKSH"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
